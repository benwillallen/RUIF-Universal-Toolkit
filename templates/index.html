{% extends 'base.html' %}

{% block title %}
<h1>Home</h1>
{% endblock %}

{% block body %}
<p>Welcome to the home page!</p>
<div class="content">
    <h2>Table</h2>
    <table>
        <tr>
            <th>Task</th>
            <th>Added</th>
            <th>Actions</th>
        </tr>
        <tr>
        {% for task in tasks %}
            <td>{{ task.content }}</td>
            <td>{{ task.date_created.date() }}</td>
            <td>
                <a href="">Delete</a>
                <br>
                <a href="">Update</a>
            </td>
        </tr>
        {% endfor %}
    </table>
    <form action="/", method="POST">
        <input type="text" name="content" placeholder="Task" id="content">
        <input type="submit" value="Add Task">
    </form>
</div>
{% endblock %}
